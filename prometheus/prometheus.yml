global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    cluster: clinical-telemetry-local

scrape_configs:
  - job_name: 'ktor-ingest'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'ingest'

  - job_name: 'telemetry-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'worker'

  - job_name: 'ml-detector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9200']
        labels:
          service: 'ml-detector'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
